name: Build TeleDrive APK (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      # Repo ini sengaja hanya berisi lib/ + pubspec (tanpa folder android/ios
      # yang di-generate). Kalau folder platform belum ada, generate dulu.
      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then flutter create . --org com.bangmujer --project-name teledrive --platforms android,ios; fi
      - name: Get dependencies
        run: flutter pub get
            - name: Generate app icons
            run: |
            mkdir -p assets
            python3 -c "import base64, pathlib; pathlib.Path('assets/app_icon.png').write_bytes(base64.b64decode(pathlib.Path('assets/app_icon.png.b64').read_text()))"
            dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teledrive-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
